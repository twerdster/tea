name: Python tooling tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-tools.txt
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
