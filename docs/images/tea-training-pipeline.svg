<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" aria-labelledby="title desc">
  <title id="title">Tea training flow (explanatory illustration)</title>
  <desc id="desc">Explanatory diagram, not a result: a column-wise feature dataset is streamed to CUDA GPU workers that build class histograms and entropy split scores; the host picks the best split per node, reorders samples and repeats per depth, then writes the tree and predicted labels.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2937; }
    .h { font-size: 17px; font-weight: 700; }
    .t { font-size: 13px; }
    .m { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; fill: #374151; }
    .note { font-size: 12px; fill: #6b7280; font-style: italic; }
    .flow { stroke: #4b5563; stroke-width: 2; fill: none; marker-end: url(#arrow); }
  </style>
  <rect width="960" height="400" fill="#ffffff"/>
  <text x="24" y="34" class="h" style="font-size:20px">Tea: GPU training of a randomized decision tree</text>
  <text x="936" y="34" class="note" text-anchor="end">Explanatory illustration, not a benchmark or result</text>

  <!-- Dataset -->
  <rect x="24" y="70" width="230" height="250" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="139" y="100" class="h" text-anchor="middle">1. Dataset on disk</text>
  <text x="139" y="122" class="t" text-anchor="middle">precomputed, column-wise</text>
  <text x="44" y="156" class="m">Labels.lbl</text>
  <text x="44" y="176" class="m">Threshholds.thr</text>
  <g fill="#c7d2fe" stroke="#6366f1">
    <rect x="44" y="196" width="34" height="96" rx="3"/>
    <rect x="86" y="196" width="34" height="96" rx="3"/>
    <rect x="128" y="196" width="34" height="96" rx="3"/>
    <rect x="198" y="196" width="34" height="96" rx="3"/>
  </g>
  <text x="180" y="248" class="t" text-anchor="middle">…</text>
  <text x="139" y="310" class="m" text-anchor="middle">F_0000.feat … F_NNNN.feat</text>

  <!-- GPU workers -->
  <rect x="300" y="70" width="320" height="250" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="460" y="100" class="h" text-anchor="middle">2. CUDA GPU workers</text>
  <text x="460" y="122" class="t" text-anchor="middle">one feature column at a time</text>
  <g class="t">
    <text x="322" y="156">• copy column to the device</text>
    <text x="322" y="180">• scatter into current sample order</text>
    <text x="322" y="204">• test candidate thresholds</text>
    <text x="322" y="228">• accumulate class histograms per node</text>
    <text x="322" y="252">• compute entropy split scores</text>
  </g>
  <text x="460" y="300" class="m" text-anchor="middle">histograms.cu · entropies.cu</text>

  <!-- Host -->
  <rect x="666" y="70" width="270" height="140" rx="12" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="801" y="100" class="h" text-anchor="middle">3. Host reduction</text>
  <g class="t">
    <text x="686" y="132">• best split for every active node</text>
    <text x="686" y="156">• reorder sample index lists</text>
    <text x="686" y="180">• snapshot tree, go to next depth</text>
  </g>

  <!-- Outputs -->
  <rect x="666" y="232" width="270" height="88" rx="12" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="801" y="258" class="h" text-anchor="middle">4. Tree + predicted labels</text>
  <text x="686" y="282" class="m">Tree_0000.tree</text>
  <text x="686" y="302" class="m">Tree_0000.tree.labels</text>

  <!-- arrows -->
  <path d="M254,195 L296,195" class="flow"/>
  <path d="M620,140 L662,140" class="flow"/>
  <path d="M801,210 L801,228" class="flow"/>
  <path d="M760,70 C760,48 470,48 470,66" class="flow" stroke-dasharray="6 4"/>
  <rect x="528" y="43" width="174" height="20" rx="4" fill="#ffffff"/>
  <text x="615" y="58" class="t" text-anchor="middle" style="fill:#4b5563">repeat for each depth level</text>

  <text x="24" y="360" class="note">Steps follow docs/training-workflow.md. File names follow the README's input and output formats.</text>
  <text x="24" y="380" class="note">The .labels file holds one predicted label per training sample. Supported smoke tests cover depths 0 and 1.</text>
</svg>
